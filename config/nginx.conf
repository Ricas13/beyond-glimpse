# Hard-bounded on-demand Jellyfin poster cache. The cache is deliberately
# ephemeral and is never mounted as persistent application data.
proxy_cache_path /var/cache/nginx/posters levels=1:2 keys_zone=poster_cache:4m max_size=256m inactive=30d use_temp_path=off;

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    root /app/web;
    index index.html;

    # Baseline public-web hardening. Glimpse still contains inherited inline CSS/JS,
    # so the CSP intentionally permits inline code while preventing third-party
    # scripts, plugins, framing, and unexpected network destinations.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/json;
    gzip_disable "MSIE [1-6]\.";

    location = /healthz {
        access_log off;
        default_type application/json;
        expires epoch;
        return 200 '{"status":"ok","service":"beyond-glimpse"}';
    }

    # Generated safely from JELLYFIN_URL/JELLYFIN_TOKEN at container startup.
    # It is included before the generic image regex so /poster/*.jpg uses the
    # bounded proxy cache instead of the normal static-file location.
    include /etc/nginx/poster-proxy.inc;

    location ~* \.(jpg|jpeg|png|gif|ico|css|js)$ {
        expires 7d;
    }

    location ~* ^/data/.*/(image-state\.json|checksums\.pkl|catalog\.db(?:-wal|-shm)?|sync\.lock|sync-status\.json)$ {
        return 404;
    }
    location ~ ^/data/.*/\. {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /data/ {
        alias /app/data/;
        autoindex off;
    }

    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
