[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/var/log/nginx/access.log
stderr_logfile=/var/log/nginx/error.log
priority=10

# Small localhost-only API serving paginated browse/search results from SQLite,
# lazy item details, and catalogue-whitelisted poster fetches.
[program:catalogue-api]
command=/usr/local/bin/python -u /app/scripts/catalogue_service.py
directory=/app
autostart=true
autorestart=true
startsecs=1
startretries=5
stdout_logfile=/var/log/catalogue-api.log
stderr_logfile=/var/log/catalogue-api.log
priority=15

# Retained for Plex/Emby compatibility. Jellyfin v2 scheduling is handled by the
# dedicated lightweight scheduler below.
[program:cron]
command=/usr/sbin/cron -f
autostart=true
autorestart=true
stdout_logfile=/var/log/cron.log
stderr_logfile=/var/log/cron.log
priority=20

# One-shot lightweight bootstrap. Nginx and catalogue-api are already live, and
# each committed page becomes browseable immediately while later pages continue.
[program:initial-sync]
command=/usr/local/bin/python -u /app/scripts/initial_sync.py
directory=/app
autostart=true
autorestart=false
startsecs=0
startretries=0
exitcodes=0
stdout_logfile=/var/log/initial-sync.log
stderr_logfile=/var/log/initial-sync.log
priority=30

# Cheap changed-item sync every few minutes; the sync script itself performs the
# slower ID-only reconciliation only when its configured interval is due.
[program:catalogue-scheduler]
command=/usr/local/bin/python -u /app/scripts/catalogue_scheduler.py
directory=/app
autostart=true
autorestart=true
startsecs=1
startretries=5
stdout_logfile=/var/log/catalogue-scheduler.log
stderr_logfile=/var/log/catalogue-scheduler.log
priority=40
