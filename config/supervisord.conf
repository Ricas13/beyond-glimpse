[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/var/log/nginx/access.log
stderr_logfile=/var/log/nginx/error.log
priority=10

[program:cron]
command=/usr/sbin/cron -f
autostart=true
autorestart=true
stdout_logfile=/var/log/cron.log
stderr_logfile=/var/log/cron.log
priority=20

# One-shot first/startup sync. Supervisor starts Nginx first, so Docker/Traefik
# health becomes available immediately even when the first catalogue import is large.
[program:initial-sync]
command=/usr/local/bin/python /app/scripts/initial_sync.py
directory=/app
autostart=true
autorestart=false
startsecs=0
startretries=0
exitcodes=0
stdout_logfile=/var/log/initial-sync.log
stderr_logfile=/var/log/initial-sync.log
priority=30
