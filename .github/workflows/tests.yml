name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m py_compile scripts/*.py
      - name: Check browser JavaScript
        run: |
          node --check web/large-library.js
          node --check web/library-browse.js
          node --check web/tv-episodes.js
          node --check web/startup-status.js
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Build container image
        run: docker build --tag beyond-glimpse:test .
